<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>自選股</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --red:#FF3A30; --green:#2ECD6F; --yellow:#FFD60A;
      --bg:#000; --bg1:#0c0c0c; --bg2:#181818;
      --line:#252525; --text:#e8e8e8; --muted:#777; --orange:#FF8C00;
    }
    html,body { height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,'PingFang TC','Helvetica Neue',sans-serif;
      -webkit-font-smoothing:antialiased; }
    #app { display:flex; flex-direction:column; height:100dvh;
      max-width:430px; margin:0 auto; background:var(--bg); overflow:hidden; }

    /* ── Header ── */
    .header { display:flex; align-items:center; padding:11px 14px;
      background:var(--bg1); flex-shrink:0; }
    .hd-back  { font-size:26px; color:var(--muted); width:28px; cursor:pointer; line-height:1; }
    .hd-title { flex:1; text-align:center; font-size:16px; font-weight:700; letter-spacing:.3px; cursor:pointer; }
    .hd-icons { width:56px; display:flex; justify-content:flex-end; gap:14px; color:#fff; font-size:16px; }

    /* ── Index Bar ── */
    .idx-bar { display:flex; align-items:center; padding:5px 14px 7px;
      background:var(--bg1); border-bottom:1px solid var(--line); gap:20px; flex-shrink:0; }
    .idx-item { display:flex; align-items:baseline; gap:5px; font-size:12px; }
    .idx-name { color:var(--muted); }
    .idx-val  { font-size:13px; font-weight:600; }
    .idx-ch   { font-size:11.5px; }
    .idx-status { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }
    .idx-status.live  { color:var(--green); }
    .idx-status.close { color:var(--orange); }
    .idx-status.err   { color:var(--red); }

    /* ── Colors ── */
    .up { color:var(--red); } .dn { color:var(--green); }
    .flat { color:var(--yellow); } .neu { color:#aaa; }

    /* ── Tabs ── */
    .tabs { display:flex; background:var(--bg1); border-bottom:1px solid var(--line); flex-shrink:0; }
    .tab { flex:1; text-align:center; padding:9px 0 8px; font-size:14px; color:var(--muted);
      cursor:pointer; position:relative; transition:color .15s; }
    .tab.on { color:var(--orange); font-weight:600; }
    .tab.on::after { content:''; position:absolute; bottom:0; left:18%; right:18%;
      height:2px; background:var(--orange); border-radius:1px; }

    /* ── Table ── */
    .tbl-area { flex:1; overflow:hidden; }
    .tbl-scroll { width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch; }
    .tbl-scroll::-webkit-scrollbar { width:0; height:0; }
    table { border-collapse:separate; border-spacing:0; min-width:100%; width:max-content; }
    thead { position:sticky; top:0; z-index:20; }
    .ch th { background:var(--bg2); color:#fff; font-size:13px; font-weight:400;
      padding:5px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
    .ch th:first-child { text-align:left; position:sticky; left:0; z-index:30; background:var(--bg2); min-width:80px; }
    .ir td { background:#101010; font-size:15px; padding:8px 10px;
      text-align:right; white-space:nowrap; border-bottom:1px solid #2c2c2c; }
    .ir td:first-child { text-align:left; position:sticky; left:0; z-index:25;
      background:#101010; min-width:80px; font-weight:500; }
    tbody tr { cursor:pointer; transition:background .1s; }
    tbody tr:active { background:#1c1c1c; }
    tbody td { font-size:16px; padding:9px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid #181818; }
    tbody td:first-child { text-align:left; position:sticky; left:0; z-index:10; background:var(--bg); min-width:80px; }
    .lup-badge { display:inline-block; background:var(--red); color:#fff;
      padding:1px 5px; border-radius:2px; font-size:13px; }
    .loading-row td { color:var(--muted) !important; }

    /* ── Bottom Nav ── */
    .bnav { display:flex; background:var(--bg1); border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom,4px); flex-shrink:0; }
    .bnav-item { flex:1; display:flex; flex-direction:column; align-items:center;
      padding:7px 0 5px; gap:3px; cursor:pointer; }
    .bnav-ico { font-size:26px; line-height:1.2; color:#fff; }
    .bnav-lbl { font-size:14px; color:#fff; }
    .bnav-item.on .bnav-ico, .bnav-item.on .bnav-lbl { color:var(--orange); }

    /* ── Add View ── */
    .add-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .search-bar { display:flex; gap:8px; padding:10px 14px;
      background:var(--bg1); border-bottom:1px solid var(--line); flex-shrink:0; }
    .search-input { flex:1; background:#222; border:none; border-radius:8px;
      padding:8px 12px; color:var(--text); font-size:15px; outline:none;
      -webkit-appearance:none; caret-color:var(--orange); }
    .search-input::placeholder { color:var(--muted); }
    .search-input::-webkit-search-cancel-button { opacity:.5; cursor:pointer; }
    .search-btn { background:var(--orange); color:#fff; border:none;
      border-radius:8px; padding:8px 14px; font-size:13px;
      cursor:pointer; white-space:nowrap; font-weight:600; }
    .result-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .result-item { display:flex; align-items:center; padding:11px 14px;
      border-bottom:1px solid #181818; gap:10px; }
    .ri-code { font-size:14px; font-weight:700; width:46px; flex-shrink:0; }
    .ri-name { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ri-ex { font-size:10px; color:var(--muted); background:#222;
      padding:2px 5px; border-radius:3px; flex-shrink:0; }
    .ri-add { background:var(--red); color:#fff; border:none;
      border-radius:5px; padding:5px 11px; font-size:12px; cursor:pointer; flex-shrink:0; }
    .ri-added { color:var(--green); font-size:18px; flex-shrink:0; }
    .list-msg { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; line-height:1.8; }
    .direct-card { margin:16px 14px; background:#1a1a1a; border-radius:10px;
      padding:14px 16px; display:flex; align-items:center; gap:12px; }
    .dc-code { font-size:16px; font-weight:700; color:var(--orange); flex-shrink:0; }
    .dc-desc { flex:1; font-size:12px; color:var(--muted); line-height:1.5; }
    .dc-btn { background:var(--orange); color:#fff; border:none;
      border-radius:6px; padding:7px 13px; font-size:12px; cursor:pointer; font-weight:600; flex-shrink:0; }
    .dc-btn:disabled { opacity:.5; }

    /* ── Group Panel ── */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100;
      display:flex; flex-direction:column; justify-content:flex-end;
      animation:fadeIn .2s; }
    .group-sheet { background:#161616; border-radius:14px 14px 0 0;
      overflow:hidden; padding-bottom:env(safe-area-inset-bottom,8px);
      animation:slideUp .22s cubic-bezier(.32,1,.23,1); }
    @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
    @keyframes slideUp { from { transform:translateY(100%) } to { transform:translateY(0) } }
    .gs-title { text-align:center; padding:14px 16px 12px; color:var(--muted);
      font-size:13px; border-bottom:1px solid var(--line); }
    .gs-item { display:flex; align-items:center; padding:14px 16px;
      gap:14px; border-bottom:1px solid #1c1c1c; }
    .gs-item.cur { color:var(--orange); }
    .gs-check { width:20px; font-size:16px; text-align:center; flex-shrink:0; }
    .gs-name  { flex:1; font-size:15px; }
    .gs-edit  { padding:4px 8px; color:var(--muted); font-size:16px; cursor:pointer; flex-shrink:0; }
    .gs-input { flex:1; background:#2a2a2a; border:1px solid var(--orange);
      border-radius:6px; padding:4px 10px; color:var(--text); font-size:15px; outline:none; }
    .sync-ic.ok   { color:var(--green); }
    .sync-ic.busy { color:var(--orange); }
    .sync-ic.err  { color:var(--red); }
    .gs-cancel { display:block; text-align:center; padding:16px;
      color:var(--muted); font-size:15px; cursor:pointer; border-top:1px solid var(--line); }

    /* ── Detail View ── */
    .detail-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .detail-price-sec { padding:28px 18px 22px; text-align:center; border-bottom:1px solid var(--line); }
    .dp-price { font-size:44px; font-weight:700; letter-spacing:-1px; line-height:1.1; margin-bottom:8px; }
    .dp-change { font-size:17px; font-weight:500; margin-bottom:5px; }
    .dp-status { font-size:11px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); }
    .dg-item { background:var(--bg1); padding:14px 18px; }
    .dg-full { grid-column:1 / -1; }
    .dg-lbl { display:block; font-size:11px; color:var(--muted); margin-bottom:5px; }
    .dg-val { display:block; font-size:18px; font-weight:600; }

    /* ── Edit Mode List ── */
    .edit-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .edit-item { display:flex; align-items:center; padding:13px 14px;
      border-bottom:1px solid #181818; gap:12px; background:var(--bg);
      transition:background .1s; }
    .edit-item.dragging { background:#1a2a1a; }
    .ei-handle { font-size:22px; color:#444; padding:4px 10px 4px 0;
      touch-action:none; user-select:none; -webkit-user-select:none;
      flex-shrink:0; line-height:1; cursor:grab; }
    .ei-info { flex:1; min-width:0; }
    .ei-code { font-size:14px; font-weight:700; display:block; margin-bottom:2px; }
    .ei-name { font-size:12px; color:var(--muted); display:block;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ei-del  { width:28px; height:28px; display:flex; align-items:center;
      justify-content:center; background:var(--red); color:#fff; border:none;
      border-radius:50%; font-size:20px; line-height:1; cursor:pointer;
      flex-shrink:0; padding:0 0 1px 0; }
  </style>
</head>
<body>
<div id="app">

  <!-- ═══════════════ LIST VIEW ═══════════════ -->
  <template v-if="view === 'list'">
    <div class="header">
      <div class="hd-back">‹</div>
      <div class="hd-title" @click="showGroupPanel = true" style="line-height:1.3">
        <div>{{ curGroup.name }} ⌄</div>
        <div style="font-size:11px;font-weight:400;color:var(--muted);margin-top:1px">{{ todayDate }}</div>
      </div>
      <div class="hd-icons">
        <template v-if="editMode">
          <span style="font-size:14px;color:var(--orange);font-weight:600;cursor:pointer" @click="editMode=false">完成</span>
        </template>
        <template v-else>
          <span class="sync-ic" :class="syncState" style="font-size:16px;line-height:1.2;cursor:pointer" @click="openSync">☁</span>
          <span style="font-size:14px;cursor:pointer" @click="editMode=true">✎</span>
        </template>
      </div>
    </div>

    <div class="idx-bar">
      <div class="idx-item" v-for="idx in indexBar" :key="idx.key">
        <span class="idx-name">{{ idx.name }}</span>
        <span class="idx-val" :class="cc(idx.change)">{{ fp(idx.value) }}</span>
        <span class="idx-ch"  :class="cc(idx.change)">{{ fc(idx.change) }}</span>
        <span class="idx-ch"  :class="cc(idx.change)">{{ fpct(idx.pct) }}</span>
      </div>
      <span class="idx-status" :class="status.cls">{{ status.text }}</span>
    </div>

    <div class="tabs">
      <div v-for="t in tabs" :key="t" class="tab" :class="{ on: tab === t }" @click="tab = t">{{ t }}</div>
    </div>

    <!-- 編輯模式：排序 / 刪除 -->
    <div v-if="editMode" class="edit-list">
      <div v-for="(code, idx) in watchlist" :key="code"
           class="edit-item" :class="{ dragging: dragIdx === idx }"
           :data-edit-idx="idx">
        <span class="ei-handle" @touchstart="startDrag($event, idx)">≡</span>
        <div class="ei-info">
          <span class="ei-code">{{ code }}</span>
          <span class="ei-name">{{ stockMap[code]?.name || code }}</span>
        </div>
        <button class="ei-del" @click.stop="removeStock(idx)">×</button>
      </div>
      <div v-if="!watchlist.length" class="list-msg">此群組尚無自選股</div>
    </div>

    <!-- 即時 表格 -->
    <div v-else-if="tab === '即時'" class="tbl-area"><div class="tbl-scroll">
      <table>
        <thead>
          <tr class="ch">
            <th>商品<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:5px">{{ tableDate }}<template v-if="tableTime"> {{ tableTime }}</template></span></th>
            <th>成交</th><th>漲跌</th><th>幅度</th>
            <th>最高</th><th>最低</th>
          </tr>
          <tr class="ir">
            <td>{{ tseIdx.name }}</td>
            <td :class="cc(tseIdx.change)">{{ fp(tseIdx.price) }}</td>
            <td :class="cc(tseIdx.change)">{{ fc(tseIdx.change) }}</td>
            <td :class="cc(tseIdx.change)">{{ fpct(tseIdx.pct) }}</td>
            <td class="up">{{ fp(tseIdx.high) }}</td>
            <td class="dn">{{ fp(tseIdx.low) }}</td>
          </tr>
        </thead>
        <tbody>
          <template v-if="misLoading">
            <tr v-for="i in (watchlist.length || 6)" :key="'ph'+i" class="loading-row">
              <td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td>
            </tr>
          </template>
          <template v-else>
            <tr v-for="s in rows" :key="s.code" @click="openDetail(s.code)">
              <td>{{ s.name }}</td>
              <td>
                <span v-if="s.limitUp" class="lup-badge">{{ fp(s.price) }}</span>
                <span v-else :class="cc(s.change)">{{ fp(s.price) }}</span>
              </td>
              <td :class="cc(s.change)">{{ fc(s.change) }}</td>
              <td :class="cc(s.change)">{{ fpct(s.pct) }}</td>
              <td :class="cc(s.change)">{{ fp(s.high) }}</td>
              <td :class="cc(s.change)">{{ fp(s.low) }}</td>
            </tr>
          </template>
        </tbody>
      </table>
    </div></div>

    <!-- 法人 表格 -->
    <div v-else-if="tab === '法人'" class="tbl-area"><div class="tbl-scroll">
      <table>
        <thead>
          <tr class="ch">
            <th>商品</th>
            <th>外資</th><th>投信</th><th>自營</th><th>合計</th>
          </tr>
        </thead>
        <tbody>
          <template v-if="instLoading">
            <tr v-for="i in (watchlist.length||6)" :key="'iph'+i" class="loading-row">
              <td>--</td><td>--</td><td>--</td><td>--</td><td>--</td>
            </tr>
          </template>
          <template v-else>
            <tr v-for="s in instRows" :key="s.code" @click="openDetail(s.code)">
              <td>{{ s.name }}</td>
              <td :class="cc(s.foreign)">{{ fchg(s.foreign) }}</td>
              <td :class="cc(s.trust)">{{ fchg(s.trust) }}</td>
              <td :class="cc(s.dealer)">{{ fchg(s.dealer) }}</td>
              <td :class="cc(s.total)" style="font-weight:600">{{ fchg(s.total) }}</td>
            </tr>
          </template>
        </tbody>
      </table>
    </div></div>

    <!-- 信用 表格 -->
    <div v-else-if="tab === '信用'" class="tbl-area"><div class="tbl-scroll">
      <table>
        <thead>
          <tr class="ch">
            <th>商品</th>
            <th>融資餘額</th><th>融資+-</th><th>融券餘額</th><th>融券+-</th>
          </tr>
        </thead>
        <tbody>
          <template v-if="marginLoading">
            <tr v-for="i in (watchlist.length||6)" :key="'mph'+i" class="loading-row">
              <td>--</td><td>--</td><td>--</td><td>--</td><td>--</td>
            </tr>
          </template>
          <template v-else>
            <tr v-for="s in marginRows" :key="s.code" @click="openDetail(s.code)">
              <td>{{ s.name }}</td>
              <td class="neu">{{ flot(s.marginBal) }}</td>
              <td :class="cc(s.marginChg)">{{ fchg(s.marginChg) }}</td>
              <td class="neu">{{ flot(s.shortBal) }}</td>
              <td :class="cc(s.shortChg)">{{ fchg(s.shortChg) }}</td>
            </tr>
          </template>
        </tbody>
      </table>
    </div></div>

    <!-- 營收 佔位 -->
    <div v-else class="tbl-area" style="display:flex;align-items:center;justify-content:center">
      <div style="color:var(--muted);font-size:13px;text-align:center;line-height:2.2">
        月營收功能<br>開發中
      </div>
    </div>
  </template>

  <!-- ═══════════════ DETAIL VIEW ═══════════════ -->
  <template v-else-if="view === 'detail'">
    <div class="header">
      <div class="hd-back" @click="view = 'list'" style="cursor:pointer">‹</div>
      <div class="hd-title" style="line-height:1.25">
        <div>{{ detailStock?.name || detailCode }}</div>
        <div style="font-size:11px;font-weight:400;color:var(--muted)">{{ detailCode }}</div>
      </div>
      <div class="hd-icons"></div>
    </div>

    <div class="detail-area">
      <div class="detail-price-sec">
        <div class="dp-price" :class="cc(detailStock?.change)">
          <span v-if="detailStock?.limitUp" class="lup-badge" style="font-size:34px;padding:2px 10px">{{ fp(detailStock?.price) }}</span>
          <span v-else>{{ fp(detailStock?.price) }}</span>
        </div>
        <div class="dp-change" :class="cc(detailStock?.change)">{{ fc(detailStock?.change) }}&ensp;{{ fpct(detailStock?.pct) }}</div>
        <div class="dp-status" :class="status.cls">{{ status.text }}</div>
      </div>

      <div class="detail-grid">
        <div class="dg-item">
          <span class="dg-lbl">開盤</span>
          <span class="dg-val neu">{{ fp(detailStock?.open) }}</span>
        </div>
        <div class="dg-item">
          <span class="dg-lbl">昨收</span>
          <span class="dg-val neu">{{ fp(detailStock?.prevClose) }}</span>
        </div>
        <div class="dg-item">
          <span class="dg-lbl">最高</span>
          <span class="dg-val up">{{ fp(detailStock?.high) }}</span>
        </div>
        <div class="dg-item">
          <span class="dg-lbl">最低</span>
          <span class="dg-val dn">{{ fp(detailStock?.low) }}</span>
        </div>
        <div class="dg-item">
          <span class="dg-lbl">漲停</span>
          <span class="dg-val up">{{ fp(detailStock?.limitUpPx) }}</span>
        </div>
        <div class="dg-item">
          <span class="dg-lbl">跌停</span>
          <span class="dg-val dn">{{ fp(detailStock?.limitDnPx) }}</span>
        </div>
        <div class="dg-item dg-full">
          <span class="dg-lbl">成交量</span>
          <span class="dg-val neu">{{ fvol(detailStock?.vol) }} 張</span>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════════ ADD VIEW ═══════════════ -->
  <template v-else-if="view === 'add'">
    <div class="header">
      <div class="hd-back" @click="view = 'list'">‹</div>
      <div class="hd-title">加入「{{ curGroup.name }}」</div>
      <div class="hd-icons"></div>
    </div>

    <div class="add-area">
      <div class="search-bar">
        <input
          type="text"
          ref="searchRef"
          :value="searchText"
          @input="searchText = $event.target.value"
          placeholder="輸入代號或名稱…"
          class="search-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <button class="search-btn" @click="searchText = searchRef?.value || searchText">搜尋</button>
      </div>

      <div class="result-area">
        <!-- 載入中 -->
        <div v-if="listLoading" class="list-msg">載入股票清單中…</div>

        <!-- 等待輸入 -->
        <div v-else-if="!searchText.trim()" class="list-msg">
          請輸入股票代號或名稱<br>
          <span v-if="stockList.length" style="font-size:11px;color:var(--muted)">
            上市 {{ listCounts.tse }} 支 / 上櫃 {{ listCounts.otc }} 支
            <span @click="reloadStockList" style="color:var(--orange);margin-left:8px;cursor:pointer">重新載入</span>
          </span>
          <span v-else style="font-size:11px;color:var(--red)">清單載入失敗
            <span @click="reloadStockList" style="color:var(--orange);margin-left:8px;cursor:pointer">重試</span>
          </span>
        </div>

        <!-- 有結果 -->
        <template v-else-if="searchResults.length > 0">
          <div v-for="s in searchResults" :key="s.c + s.ex" class="result-item">
            <span class="ri-code" :class="inWatchlist(s.c) ? 'neu' : ''">{{ s.c }}</span>
            <span class="ri-name">{{ s.n }}</span>
            <span class="ri-ex">{{ s.ex.toUpperCase() }}</span>
            <span v-if="inWatchlist(s.c)" class="ri-added">✓</span>
            <button v-else class="ri-add" @click="addStock(s.c, s.n)">加入</button>
          </div>
        </template>

        <!-- 無結果 -->
        <template v-else>
          <div class="list-msg">找不到「{{ searchText }}」</div>
          <!-- 直接加入（代號格式） -->
          <div v-if="showDirectAdd" class="direct-card">
            <span class="dc-code">{{ searchText.trim().toUpperCase() }}</span>
            <span class="dc-desc">{{ directStatus === 'checking' ? '驗證中…' : directStatus === 'not_found' ? '此代號不存在' : directStatus === 'error' ? '連線失敗' : '不在清單中，要直接加入嗎？' }}</span>
            <button
              class="dc-btn"
              :disabled="directStatus === 'checking' || directStatus === 'added'"
              @click="directAdd"
            >{{ directStatus === 'added' ? '✓ 已加入' : '直接加入' }}</button>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ═══════════════ BOTTOM NAV（共用） ═══════════════ -->
  <div class="bnav">
    <div class="bnav-item" :class="{ on: view==='list'||view==='detail' }" @click="view='list'">
      <span class="bnav-ico">★</span><span class="bnav-lbl">自選股</span>
    </div>
    <div class="bnav-item">
      <span class="bnav-ico">≋</span><span class="bnav-lbl">大盤動態</span>
    </div>
    <div class="bnav-item" :class="{ on: view==='add' }" @click="openAdd">
      <span class="bnav-ico">⊕</span><span class="bnav-lbl">加入自選</span>
    </div>
    <div class="bnav-item">
      <span class="bnav-ico">⚙</span><span class="bnav-lbl">設定</span>
    </div>
  </div>

  <!-- ═══════════════ 群組面板（bottom sheet） ═══════════════ -->
  <div v-if="showGroupPanel" class="overlay" @click.self="showGroupPanel = false">
    <div class="group-sheet">
      <div class="gs-title">切換自選群組</div>
      <div v-for="(g, i) in groupsData.groups" :key="i"
           class="gs-item" :class="{ cur: i === groupsData.current }">
        <span class="gs-check">{{ i === groupsData.current ? '✓' : '' }}</span>

        <!-- 改名模式 -->
        <input v-if="editIdx === i"
          class="gs-input" :value="editName"
          @input="editName = $event.target.value"
          @keydown.enter.prevent="confirmRename(i)"
          @blur="confirmRename(i)"
          ref="renameInputEl"
        />
        <!-- 一般顯示 -->
        <span v-else class="gs-name" @click="switchGroup(i)">{{ g.name }}</span>

        <span class="gs-edit" @click.stop="startRename(i)">✎</span>
      </div>
      <span class="gs-cancel" @click="showGroupPanel = false">取消</span>
    </div>
  </div>

  <!-- ═══════════════ 雲端同步設定 ═══════════════ -->
  <div v-if="showSync" class="overlay" @click.self="showSync = false">
    <div class="group-sheet">
      <div class="gs-title">多裝置同步自選股</div>
      <div style="padding:14px 16px;font-size:13px;line-height:1.6;color:var(--muted)">
        貼上 Google Apps Script 網頁應用程式網址，所有填同一個網址的手機會共用自選股。
        <input class="gs-input" style="display:block;width:100%;margin:10px 0;box-sizing:border-box"
               v-model="syncInput" placeholder="https://script.google.com/macros/s/…/exec" />
        <div>狀態：<span class="sync-ic" :class="syncState">{{ syncMsg }}</span></div>
        <div v-if="syncUrl" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <span class="dc-btn" @click="forceUpload">⬆ 以這支手機為準上傳</span>
          <span class="dc-btn" style="background:#2a2a2a;color:var(--text)" @click="forceDownload">⬇ 用雲端覆蓋這支手機</span>
        </div>
        <div v-if="syncUrl" style="margin-top:10px">
          其他手機開這個連結即可自動設定：
          <div style="word-break:break-all;color:var(--text);user-select:all;margin-top:4px">{{ syncShareLink }}</div>
          <span class="dc-btn" style="display:inline-block;margin-top:8px" @click="copyShareLink">{{ copied ? '已複製' : '複製連結' }}</span>
        </div>
      </div>
      <div style="display:flex">
        <span class="gs-cancel" style="flex:1" @click="showSync = false">取消</span>
        <span class="gs-cancel" style="flex:1;color:var(--orange)" @click="saveSyncUrl">儲存</span>
      </div>
    </div>
  </div>

</div>
<script>
const { createApp, ref, computed, watch, onMounted, onUnmounted, nextTick } = Vue

// ─── API endpoints（本機走 proxy，線上走直接 API） ─────────────────
const isLocal  = ['localhost','127.0.0.1'].includes(location.hostname)
const TWSE_URL    = isLocal ? '/proxy/twse'     : 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
const TPEX_URL    = isLocal ? '/proxy/tpex'     : 'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes'
const MI_IDX_URL  = isLocal ? '/proxy/mi_index' : 'https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX'
const INST_FOREIGN_URL = isLocal ? '/proxy/inst_foreign' : 'https://openapi.twse.com.tw/v1/fund/MI_QFIIS'
const INST_TRUST_URL   = isLocal ? '/proxy/inst_trust'   : 'https://openapi.twse.com.tw/v1/fund/TWT93U'
const INST_DEALER_URL  = isLocal ? '/proxy/inst_dealer'  : 'https://openapi.twse.com.tw/v1/fund/MI_PROPRIETARY'
const OTC_FOREIGN_URL  = isLocal ? '/proxy/otc_foreign'  : 'https://www.tpex.org.tw/openapi/v1/tpex_qfii_trn'
const OTC_TRUST_URL    = isLocal ? '/proxy/otc_trust'    : 'https://www.tpex.org.tw/openapi/v1/tpex_trust_fund_trn'
const OTC_DEALER_URL   = isLocal ? '/proxy/otc_dealer'   : 'https://www.tpex.org.tw/openapi/v1/tpex_dealer_trn'
const MARGIN_URL       = isLocal ? '/proxy/margin'       : 'https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_d'
const OTC_MARGIN_URL   = isLocal ? '/proxy/otc_margin'   : 'https://www.tpex.org.tw/openapi/v1/tpex_margin_trn'

// ─── localStorage keys ────────────────────────────────────────────
const GROUPS_KEY      = 'stock_groups_v1'
const CACHE_KEY       = 'stock_list_cache_v3'
const PRICE_CACHE_KEY = 'stock_price_v1'
const NAME_MAP_KEY    = 'stock_names_v1'
const SYNC_URL_KEY    = 'stock_sync_url_v1'
const SYNC_TS_KEY     = 'stock_sync_ts_v1'

// ─── 預設群組 ─────────────────────────────────────────────────────
const DEFAULT_GROUPS = {
  current: 0,
  groups: [
    { name: '自選群組一', stocks: ['2330','2317','2454','2409','3481','2408','6182','6147'] },
    { name: '自選群組二', stocks: [] },
    { name: '自選群組三', stocks: [] },
    { name: '自選群組四', stocks: [] },
    { name: '自選群組五', stocks: [] },
  ]
}

function loadGroups() {
  try { return JSON.parse(localStorage.getItem(GROUPS_KEY)) || DEFAULT_GROUPS }
  catch { return DEFAULT_GROUPS }
}
function saveGroupsToStorage(data) {
  try { localStorage.setItem(GROUPS_KEY, JSON.stringify(data)) } catch {}
}

// ─── 台北時間工具 ─────────────────────────────────────────────────
function getTaipeiNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }))
}
function getTodayStr() {
  const t = getTaipeiNow()
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`
}
function isTradingHours() {
  const t = getTaipeiNow(); const d = t.getDay()
  if (d === 0 || d === 6) return false
  const m = t.getHours()*60 + t.getMinutes()
  return m >= 540 && m < 810
}
function nowHHMMSS() {
  const t = getTaipeiNow()
  return [t.getHours(), t.getMinutes(), t.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')
}
function getTodayDisplayStr() {
  const t = getTaipeiNow()
  const days = ['日','一','二','三','四','五','六']
  const m = String(t.getMonth()+1).padStart(2,'0')
  const d = String(t.getDate()).padStart(2,'0')
  return `${t.getFullYear()}/${m}/${d} 週${days[t.getDay()]}`
}
function todayMMDD() {
  const t = getTaipeiNow()
  return `${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`
}

// ─── 搜尋正規化（臺↔台 視同） ─────────────────────────────────────
function norm(s) { return (s||'').replace(/臺/g,'台').toLowerCase() }

function timedFetch(url, ms = 8000) {
  const ctrl = new AbortController()
  const t = setTimeout(() => ctrl.abort(), ms)
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t))
}

// ─── Vue App ──────────────────────────────────────────────────────
createApp({
  setup() {
    // ── 靜態常數 ──────────────────────────────────────────
    const todayDate  = getTodayDisplayStr()
    const tableDate  = todayMMDD()
    const tableTime  = ref('')

    // ── 群組 ────────────────────────────────────────────
    const nameMap      = ref((() => { try { return JSON.parse(localStorage.getItem(NAME_MAP_KEY)||'{}') } catch { return {} } })())
    const groupsData   = ref(loadGroups())
    const curGroup     = computed(() => groupsData.value.groups[groupsData.value.current])
    const watchlist    = computed(() => curGroup.value?.stocks ?? [])
    const showGroupPanel = ref(false)
    const editIdx      = ref(-1)
    const editName     = ref('')
    const renameInputEl = ref(null)

    watch(groupsData, v => saveGroupsToStorage(v), { deep: true })

    // ── 雲端同步（多裝置共用群組；目前所在群組各裝置獨立） ──
    const syncUrl    = ref((() => { try { return localStorage.getItem(SYNC_URL_KEY) || '' } catch { return '' } })())
    const hashSync   = location.hash.match(/sync=([^&]+)/)
    if (hashSync) {
      syncUrl.value = decodeURIComponent(hashSync[1])
      try { localStorage.setItem(SYNC_URL_KEY, syncUrl.value) } catch {}
      history.replaceState(null, '', location.pathname + location.search)
    }
    const showSync   = ref(false)
    const syncInput  = ref('')
    const syncState  = ref('')
    const syncMsg    = ref(syncUrl.value ? '連線中…' : '未設定（僅存在本機）')
    const copied     = ref(false)
    const syncShareLink = computed(() => location.origin + location.pathname + '#sync=' + encodeURIComponent(syncUrl.value))
    let localTs = (() => { try { return Number(localStorage.getItem(SYNC_TS_KEY)) || 0 } catch { return 0 } })()
    let applyingRemote = false
    let pushTimer = null

    function setLocalTs(ts) {
      localTs = ts
      try { localStorage.setItem(SYNC_TS_KEY, String(ts)) } catch {}
    }
    function setSync(state, msg) { syncState.value = state; syncMsg.value = msg }

    watch(() => groupsData.value.groups, () => {
      if (applyingRemote) return
      setLocalTs(Date.now())
      if (!syncUrl.value) return
      clearTimeout(pushTimer)
      pushTimer = setTimeout(push, 800)
    }, { deep: true, flush: 'sync' })

    function applyRemote(d) {
      applyingRemote = true
      groupsData.value = {
        current: Math.min(groupsData.value.current, d.groups.length - 1),
        groups: d.groups,
      }
      applyingRemote = false
      if (d.names && Object.keys(d.names).length) {
        nameMap.value = { ...nameMap.value, ...d.names }
        try { localStorage.setItem(NAME_MAP_KEY, JSON.stringify(nameMap.value)) } catch {}
      }
      setLocalTs(d.updatedAt)
      refresh()
    }

    async function pull() {
      if (!syncUrl.value || pushTimer) return
      setSync('busy', '同步中…')
      try {
        const d = await (await timedFetch(syncUrl.value, 15000)).json()
        if (pushTimer) return  // 下載期間本機又有修改，交給 push 處理
        if (!d.groups) {                       // 雲端是空的 → 以本機為準
          if (!localTs) setLocalTs(Date.now())
          return push()
        }
        if (!d.updatedAt) {                    // 舊版寫入、無時間戳 → 無法判斷誰新，請使用者選
          setSync('err', '雲端與本機無法自動判斷，請在主要手機按「以這支手機為準上傳」')
          return
        }
        if (d.updatedAt > localTs) applyRemote(d)
        else if (localTs > d.updatedAt) return push()
        setSync('ok', '已同步 ' + nowHHMMSS())
      } catch { setSync('err', '同步失敗，請確認網址與網路') }
    }

    async function push() {
      clearTimeout(pushTimer); pushTimer = null
      if (!syncUrl.value) return
      setSync('busy', '上傳中…')
      const groups = groupsData.value.groups
      const names = {}
      for (const g of groups) for (const c of g.stocks) {
        const n = nameMap.value[c] || stockMap.value[c]?.name
        if (n) names[c] = n
      }
      try {
        const res = await fetch(syncUrl.value, {
          method: 'POST',  // body 為字串 → text/plain，不觸發 CORS preflight
          body: JSON.stringify({ updatedAt: localTs, groups, names }),
        })
        const d = await res.json()
        if (!d.ok && d.groups && d.updatedAt > localTs) applyRemote(d)
        setSync('ok', '已同步 ' + nowHHMMSS())
      } catch { setSync('err', '上傳失敗，稍後會再試') }
    }

    function openSync() {
      syncInput.value = syncUrl.value
      copied.value = false
      showSync.value = true
    }
    function saveSyncUrl() {
      const u = syncInput.value.trim()
      if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) {
        setSync('err', '網址格式不對，應為 https://script.google.com/… 開頭')
        return
      }
      syncUrl.value = u
      try { localStorage.setItem(SYNC_URL_KEY, u) } catch {}
      if (u) pull()
      else setSync('', '未設定（僅存在本機）')
      showSync.value = false
    }
    async function copyShareLink() {
      try { await navigator.clipboard.writeText(syncShareLink.value); copied.value = true } catch {}
    }
    async function forceUpload() {
      if (!confirm('用這支手機的自選股覆蓋雲端？其他手機會跟著變成這支的清單。')) return
      setLocalTs(Date.now())
      showSync.value = false
      await push()
    }
    async function forceDownload() {
      if (!confirm('用雲端的自選股覆蓋這支手機？這支手機目前的清單會被取代。')) return
      showSync.value = false
      setSync('busy', '下載中…')
      try {
        const d = await (await timedFetch(syncUrl.value, 15000)).json()
        if (!d.groups) { setSync('err', '雲端還沒有資料'); return }
        applyRemote(d)
        setSync('ok', '已同步 ' + nowHHMMSS())
      } catch { setSync('err', '下載失敗，請確認網址與網路') }
    }
    function onVisible() { if (document.visibilityState === 'visible') pull() }

    function switchGroup(idx) {
      groupsData.value.current = idx
      showGroupPanel.value = false
      refresh()
    }
    function startRename(idx) {
      editIdx.value = idx
      editName.value = groupsData.value.groups[idx].name
      nextTick(() => {
        const el = renameInputEl.value
        if (Array.isArray(el)) el[0]?.focus()
        else el?.focus()
      })
    }
    function confirmRename(idx) {
      const n = editName.value.trim()
      if (n) groupsData.value.groups[idx].name = n
      editIdx.value = -1
    }
    function addStock(code, name) {
      const stocks = curGroup.value.stocks
      if (!stocks.includes(code)) {
        stocks.push(code)
        if (name) {
          nameMap.value = { ...nameMap.value, [code]: name }
          try { localStorage.setItem(NAME_MAP_KEY, JSON.stringify(nameMap.value)) } catch {}
        }
        refresh()
      }
    }
    function inWatchlist(code) { return curGroup.value.stocks.includes(code) }

    // ── 編輯模式（刪除 / 排序） ───────────────────────────
    const editMode = ref(false)
    const dragIdx  = ref(-1)

    function removeStock(idx) {
      curGroup.value.stocks.splice(idx, 1)
    }
    function startDrag(e, idx) {
      dragIdx.value = idx
    }
    function handleTouchMove(e) {
      if (dragIdx.value === -1) return
      e.preventDefault()
      const touchY = e.touches[0].clientY
      const items  = document.querySelectorAll('[data-edit-idx]')
      for (let i = 0; i < items.length; i++) {
        if (i === dragIdx.value) continue
        const rect = items[i].getBoundingClientRect()
        const mid  = rect.top + rect.height / 2
        if ((i < dragIdx.value && touchY < mid) || (i > dragIdx.value && touchY > mid)) {
          const stocks = [...curGroup.value.stocks]
          const [moved] = stocks.splice(dragIdx.value, 1)
          stocks.splice(i, 0, moved)
          curGroup.value.stocks = stocks
          dragIdx.value = i
          break
        }
      }
    }
    function handleTouchEnd() { dragIdx.value = -1 }

    // ── 詳情頁 ────────────────────────────────────────────
    const detailCode  = ref('')
    const detailStock = computed(() => stockMap.value[detailCode.value] || null)
    function openDetail(code) { detailCode.value = code; view.value = 'detail' }

    // ── 主畫面狀態 ────────────────────────────────────────
    const tab      = ref('即時')
    const tabs     = ['即時', '法人', '信用', '營收']
    const view     = ref('list')
    const misLoading = ref(true)
    const stockMap = ref({})
    const idxData  = ref({})
    const lastPx   = {}
    const status   = ref({ text: '載入中…', cls: '' })

    const EMPTY_IDX = { name:'加權指', price:null, change:null, pct:null, high:null, low:null, prevClose:null }
    const tseIdx  = computed(() => idxData.value['t00'] ?? EMPTY_IDX)
    const indexBar = computed(() => [
      { key:'tse', name:'加權', ...pick(idxData.value['t00'],'value','change','pct') },
      { key:'otc', name:'櫃買', ...pick(idxData.value['o00'],'value','change','pct') },
    ])
    const rows = computed(() => watchlist.value.map(c =>
      stockMap.value[c] || { code:c, name:nameMap.value[c]||c, price:null, change:null, pct:null, high:null, low:null, limitUp:false }
    ))

    // ── 解析 MIS ─────────────────────────────────────────
    function parseMis(data) {
      const ns = {...stockMap.value}, ni = {...idxData.value}
      for (const item of (data.msgArray||[])) {
        const code = item.c; if (!code) continue
        const rawZ = item.z, prev = parseFloat(item.y)||0
        let price
        if (!rawZ || rawZ==='-') {
          price = lastPx[code]!=null ? lastPx[code] : prev
        } else {
          price = parseFloat(rawZ); lastPx[code] = price
        }
        const high = parseFloat(item.h)||price, low = parseFloat(item.l)||price
        const open = parseFloat(item.o)||null
        const chg  = (price!=null && prev) ? price-prev : null
        const pct  = (chg!=null && prev)   ? chg/prev*100 : null
        if (code==='t00'||code==='o00') {
          ni[code] = { name:code==='t00'?'加權指':'櫃買指',
            value:price, price, prevClose:prev, high, low, change:chg, pct }
          continue
        }
        const lup = parseFloat(item.u)||null
        const ldn = (lup!=null && prev) ? Math.round((2*prev-lup)*100)/100 : null
        if (!ns[code]||(price>0)) {
          ns[code] = { code, name:item.n||item.nf||code,
            price, prevClose:prev, open, high, low, vol:parseInt(item.v)||0,
            change:chg, pct, limitUpPx:lup, limitDnPx:ldn,
            limitUp: lup!=null && Math.abs(price-lup)<0.01 }
        }
      }
      stockMap.value = ns; idxData.value = ni
    }

    // ── 解析 OpenAPI 收盤（fallback）────────────────────
    function parseOpenApi(tse, otc) {
      const ns = {}
      for (const item of (tse||[])) {
        const code=(item.Code||'').trim(), cl=parseFloat(item.ClosingPrice), chg=parseFloat(item.Change)||0
        if (!code||isNaN(cl)||cl<=0) continue
        ns[code]={ code, name:item.Name, price:cl, prevClose:cl-chg,
          open:parseFloat(item.OpeningPrice)||null,
          high:parseFloat(item.HighestPrice)||cl, low:parseFloat(item.LowestPrice)||cl,
          vol:Math.round((parseInt(item.TradeVolume)||0)/1000),
          change:chg, pct:(cl-chg)>0?chg/(cl-chg)*100:0,
          limitUpPx:null, limitDnPx:null, limitUp:false }
      }
      for (const item of (otc||[])) {
        const code=(item.SecuritiesCompanyCode||'').trim(), cl=parseFloat(item.Close)
        const raw=item.Change, chg=(raw&&raw!=='---')?parseFloat(raw):0
        if (!code||isNaN(cl)||cl<=0) continue
        ns[code]={ code, name:item.CompanyName, price:cl, prevClose:cl-chg,
          open:parseFloat(item.Open)||null,
          high:parseFloat(item.High)||cl, low:parseFloat(item.Low)||cl,
          vol:Math.round((parseInt(item.TradingShares)||0)/1000),
          change:!isNaN(chg)?chg:0, pct:(!isNaN(chg)&&(cl-chg)>0)?chg/(cl-chg)*100:0,
          limitUpPx:null, limitDnPx:null, limitUp:false }
      }
      // 合併：有新資料的股票更新，沒有的保留舊快取
      const filtered = { ...stockMap.value }
      watchlist.value.forEach(c => { if (ns[c]) filtered[c]=ns[c] })
      if (Object.keys(filtered).length) stockMap.value = filtered
    }

    function buildExCh() {
      const parts = []
      for (const c of watchlist.value) parts.push(`tse_${c}.tw`,`otc_${c}.tw`)
      parts.push('tse_t00.tw','otc_o00.tw')
      return parts.join('|')
    }

    // 證交所／櫃買沒開 CORS：優先走使用者自己的 Apps Script 代理（☁ 設定的網址），allorigins 當備援
    function proxyUrls(url) {
      const list = []
      if (syncUrl.value) list.push(`${syncUrl.value}?url=${encodeURIComponent(url)}`)
      list.push(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`)
      return list
    }

    async function fetchMisRaw(exCh) {
      if (isLocal) {
        const r = await timedFetch(`/proxy/mis?ex_ch=${encodeURIComponent(exCh)}`)
        if (!r.ok) throw new Error('MIS '+r.status)
        return r.json()
      }
      const base = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&ex_ch=' + exCh
      return Promise.any(proxyUrls(base).map(u => timedFetch(u, 10000)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json() })
        .then(d => { if (!d.msgArray) throw new Error('no msgArray'); return d })))
    }

    // ── Yahoo 奇摩股市即時報價（線上主要來源；MIS 會拒絕 Google 伺服器，無法經代理取得）──
    // 後綴 .TW/.TWO 給錯 Yahoo 會自動更正，所以一律用 .TW
    const YAHOO_URL = 'https://tw.stock.yahoo.com/_td-stock/api/resource/StockServices.stockList;fields=avgPrice%2Corderbook;symbols='
    function parseYahoo(arr) {
      const ns = {...stockMap.value}, ni = {...idxData.value}
      const num = v => { const n = parseFloat(v?.raw ?? v); return isNaN(n) ? null : n }
      let closedAt = null
      for (const q of arr) {
        const sym = q.symbol || ''
        const price = num(q.price), prev = num(q.regularMarketPreviousClose)
        if (price == null) continue
        const chg  = num(q.change) ?? (prev ? price-prev : null)
        const pct  = (chg!=null && prev) ? chg/prev*100 : null
        const high = num(q.regularMarketDayHigh) ?? price, low = num(q.regularMarketDayLow) ?? price
        if (sym === '^TWII' || sym === '^TWOII') {
          const key = sym === '^TWII' ? 't00' : 'o00'
          ni[key] = { name:key==='t00'?'加權指':'櫃買指', value:price, price, prevClose:prev, high, low, change:chg, pct }
          if (key === 't00' && q.marketStatus === 'close') closedAt = q.regularMarketTime
          continue
        }
        const code = sym.split('.')[0]
        const lup = num(q.limitUpPrice), ldn = num(q.limitDownPrice)
        ns[code] = { code, name:q.symbolName||nameMap.value[code]||code,
          price, prevClose:prev, open:num(q.regularMarketOpen), high, low,
          vol: num(q.volumeK) ?? Math.round((num(q.volume)||0)/1000),
          change:chg, pct, limitUpPx:lup, limitDnPx:ldn,
          limitUp: lup!=null && Math.abs(price-lup)<0.01 }
      }
      stockMap.value = ns; idxData.value = ni
      return closedAt
    }
    async function fetchYahoo() {
      const syms = [...new Set(watchlist.value)].map(c => c + '.TW').concat(['^TWII', '^TWOII'])
      const url  = YAHOO_URL + encodeURIComponent(syms.join(','))
      const d = await Promise.any(proxyUrls(url).map(u => timedFetch(u, 20000)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json() })
        .then(d => { if (!Array.isArray(d) || !d.length) throw new Error('empty'); return d })))
      const closedAt = parseYahoo(d)
      misLoading.value = false
      const hms = nowHHMMSS(); tableTime.value = hms.slice(0,5)
      if (closedAt) {
        const t = new Date(new Date(closedAt).toLocaleString('en-US', { timeZone:'Asia/Taipei' }))
        const mmdd = String(t.getMonth()+1).padStart(2,'0') + '/' + String(t.getDate()).padStart(2,'0')
        status.value = { text:`收盤資料 ${mmdd}`, cls:'close' }
      } else {
        status.value = { text:`● ${hms}`, cls:'live' }
      }
      savePriceCache()
    }

    async function fetchMis() {
      const d = await fetchMisRaw(buildExCh())
      parseMis(d); misLoading.value = false
      const hms = nowHHMMSS(); tableTime.value = hms.slice(0,5)
      status.value = { text:`● ${hms}`, cls:'live' }
      savePriceCache()
    }
    // 證交所主站（www.twse.com.tw）收盤後就更新且有開 CORS；openapi.twse.com.tw 常晚一天，只當備援
    const TWSE_DAY_CSV = 'https://www.twse.com.tw/exchangeReport/STOCK_DAY_ALL?response=open_data'
    const TWSE_IDX_JSON = 'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?response=json&type=IND'
    const rocToMMDD = d => { const s = String(d||'').trim(); return s.length >= 7 ? s.slice(-4,-2)+'/'+s.slice(-2) : '' }

    // CSV：日期,證券代號,證券名稱,成交股數,成交金額,開盤價,最高價,最低價,收盤價,漲跌價差,成交筆數
    async function fetchTwseDay() {
      if (!isLocal) {
        try {
          const text = await (await timedFetch(TWSE_DAY_CSV, 15000)).text()
          const list = text.split('\n').slice(1).map(line => {
            const f = line.trim().replace(/^"|"$/g,'').split('","')
            return f.length >= 10 ? { Date:f[0], Code:f[1], Name:f[2], TradeVolume:f[3],
              OpeningPrice:f[5], HighestPrice:f[6], LowestPrice:f[7], ClosingPrice:f[8], Change:f[9] } : null
          }).filter(Boolean)
          if (list.length) return list
        } catch (e) { console.warn('[TWSE CSV]', e.message) }
      }
      return fetchJsonList(TWSE_URL)
    }
    // 回傳與 openapi MI_INDEX 相同欄位的陣列，方便共用解析
    async function fetchTwseIndex() {
      if (!isLocal) {
        try {
          const j = await (await timedFetch(TWSE_IDX_JSON, 10000)).json()
          const out = []
          for (const t of (j.tables||[])) for (const r of (t.data||[])) {
            out.push({ '日期': j.date, '指數': r[0], '收盤指數': String(r[1]).replace(/,/g,''),
              '漲跌': /-/.test(String(r[2]).replace(/<[^>]*>/g,'')) ? '-' : '+',
              '漲跌點數': String(r[3]).replace(/,/g,''), '漲跌百分比': r[4] })
          }
          if (out.length) return out
        } catch (e) { console.warn('[TWSE IDX]', e.message) }
      }
      return fetchJsonList(MI_IDX_URL)
    }

    async function fetchFallback() {
      const [r1,r2,r3] = await Promise.allSettled([
        fetchTwseDay(),
        fetchJsonList(TPEX_URL),
        fetchTwseIndex(),
      ])
      const tse = r1.status==='fulfilled'?r1.value:[], otc = r2.status==='fulfilled'?r2.value:[]
      parseOpenApi(tse, otc)
      if (r3.status==='fulfilled' && Array.isArray(r3.value)) {
        const ni = {...idxData.value}
        // 欄位名稱已改為中文（指數／收盤指數／漲跌／漲跌點數／漲跌百分比），漲跌方向另放在「漲跌」
        const item = r3.value.find(x => (x['指數'] ?? x.Index) === '發行量加權股價指數')
        if (item) {
          const sign = (item['漲跌'] ?? '') === '-' ? -1 : 1
          const px   = parseFloat(item['收盤指數'] ?? item.CloseIndex) || null
          const chgN = parseFloat(item['漲跌點數'] ?? item.Change)
          const pctN = parseFloat(String(item['漲跌百分比'] ?? item.ChangePCT ?? '').replace(/[+%]/g,''))
          const chg  = isNaN(chgN) ? null : sign * Math.abs(chgN)
          const pct  = isNaN(pctN) ? null : sign * Math.abs(pctN)
          const prev = (px!=null&&chg!=null) ? Math.round((px-chg)*100)/100 : null
          ni['t00'] = { name:'加權指', value:px, price:px, prevClose:prev,
            high:parseFloat(item.HighIndex)||px, low:parseFloat(item.LowIndex)||px, change:chg, pct }
        }
        idxData.value = ni
      }
      misLoading.value = false
      tableTime.value = nowHHMMSS().slice(0,5)
      // 顯示資料實際日期，避免把前一日收盤誤標成今天
      const dataDate = rocToMMDD(tse[0]?.Date) || rocToMMDD(otc[0]?.Date) || todayMMDD()
      status.value = { text:`收盤資料 ${dataDate}`, cls:'close' }
      savePriceCache()
    }

    let timer = null
    async function refresh() {
      if (timer) { clearTimeout(timer); timer=null }
      let misOk = false
      if (!isLocal) {
        try { await fetchYahoo(); misOk = true }
        catch(e) { console.warn('[Yahoo]', e.message) }
      }
      if (!misOk) {
        try { await fetchMis(); misOk = true }
        catch(e) { console.warn('[MIS]',e.message) }
      }
      // fetchFallback 條件：MIS 失敗，或 MIS 成功但沒有指數資料（空 msgArray）
      if (!misOk || !idxData.value.t00?.value) {
        try { await fetchFallback() }
        catch { misLoading.value=false; status.value={text:'連線失敗',cls:'err'} }
      }
      if (isTradingHours()) timer = setTimeout(refresh, 10_000)
    }
    function savePriceCache() {
      if (!Object.keys(stockMap.value).length) return
      try { localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(stockMap.value)) } catch {}
    }
    function loadPriceCache() {
      try {
        const m = JSON.parse(localStorage.getItem(PRICE_CACHE_KEY)||'null')
        if (m && Object.keys(m).length) {
          stockMap.value = m
          misLoading.value = false
          status.value = { text:'讀取中…', cls:'' }
        }
      } catch {}
    }

    onMounted(() => {
      document.addEventListener('touchmove', handleTouchMove, { passive: false })
      document.addEventListener('touchend',  handleTouchEnd)
      loadPriceCache()
      refresh()
      loadStockList()
      pull()
      document.addEventListener('visibilitychange', onVisible)
    })
    onUnmounted(() => {
      document.removeEventListener('touchmove', handleTouchMove)
      document.removeEventListener('touchend',  handleTouchEnd)
      document.removeEventListener('visibilitychange', onVisible)
      if (timer) clearTimeout(timer)
    })

    // ── 加入自選 view ─────────────────────────────────────
    const stockList    = ref([])
    const listLoading  = ref(false)
    const listCounts   = ref({ tse:0, otc:0 })
    const searchText   = ref('')
    const searchRef    = ref(null)
    const directStatus = ref('idle')

    async function fetchJsonList(url) {
      if (isLocal) {
        const r = await timedFetch(url, 15000)
        if (!r.ok) throw new Error(r.status)
        return r.json()
      }
      const tryUrl = u => timedFetch(u, 15000)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json() })
        .then(d => { if (!Array.isArray(d) || !d.length) throw new Error('empty'); return d })
      return Promise.any([url, ...proxyUrls(url)].map(tryUrl))
    }

    async function loadStockList() {
      if (stockList.value.length) return
      // 快取直接用
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')
        if (Array.isArray(cached.list) && cached.list.length > 1000) {
          stockList.value = cached.list
          const tse = cached.list.filter(s=>s.ex==='tse').length
          const otc = cached.list.filter(s=>s.ex==='otc').length
          listCounts.value = { tse, otc }
          return
        }
      } catch {}
      listLoading.value = true
      try {
        // 優先抓同源靜態 stocks.json（無 CORS 問題）
        const r = await timedFetch('stocks.json', 15000)
        if (!r.ok) throw new Error(r.status)
        const list = await r.json()
        if (Array.isArray(list) && list.length > 100) {
          stockList.value = list
          const tse = list.filter(s=>s.ex==='tse').length
          const otc = list.filter(s=>s.ex==='otc').length
          listCounts.value = { tse, otc }
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ list })) } catch {}
          listLoading.value = false
          return
        }
      } catch {}
      // fallback：直接打 API（含 CORS proxy）
      const [r1,r2] = await Promise.allSettled([
        fetchJsonList(TWSE_URL),
        fetchJsonList(TPEX_URL),
      ])
      const list = []
      let tse = 0, otc = 0
      if (r1.status==='fulfilled') {
        for (const item of (r1.value||[])) {
          const c=(item.Code||'').trim(), n=item.Name
          if (c&&n) { list.push({ c, n, ex:'tse' }); tse++ }
        }
      }
      if (r2.status==='fulfilled') {
        for (const item of (r2.value||[])) {
          const c=(item.SecuritiesCompanyCode||'').trim(), n=item.CompanyName
          if (c&&n) { list.push({ c, n, ex:'otc' }); otc++ }
        }
      }
      if (list.length) {
        stockList.value = list
        listCounts.value = { tse, otc }
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ list })) } catch {}
      } else {
        try {
          const stale = JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')
          if (Array.isArray(stale.list) && stale.list.length) {
            stockList.value = stale.list
            const t = stale.list.filter(s=>s.ex==='tse').length
            const o = stale.list.filter(s=>s.ex==='otc').length
            listCounts.value = { tse:t, otc:o }
          }
        } catch {}
      }
      listLoading.value = false
    }

    function reloadStockList() {
      stockList.value = []
      listCounts.value = { tse:0, otc:0 }
      loadStockList()
    }

    function openAdd() {
      view.value = 'add'
      loadStockList()
    }

    function doSearch() {}

    const searchResults = computed(() => {
      const q = norm(searchText.value.trim())
      if (!q) return []
      const matched = stockList.value.filter(s => {
        const c = (s.c||'').toLowerCase()
        const n = norm(s.n||'')
        return c.startsWith(q)||c.includes(q)||n.includes(q)
      })
      // 精確代號排最前
      matched.sort((a,b) => {
        const ac=(a.c||'').toLowerCase(), bc=(b.c||'').toLowerCase()
        if (ac===q) return -1; if (bc===q) return 1
        if (ac.startsWith(q)&&!bc.startsWith(q)) return -1
        if (bc.startsWith(q)&&!ac.startsWith(q)) return 1
        return 0
      })
      return matched.slice(0,60)
    })

    const showDirectAdd = computed(() => {
      if (searchResults.value.length > 0) return false
      const q = searchText.value.trim()
      return q.length>=4 && /^[0-9A-Za-z]{4,8}$/.test(q)
    })

    async function directAdd() {
      const code = searchText.value.trim().toUpperCase()
      directStatus.value = 'checking'
      try {
        const d = await fetchMisRaw(`tse_${code}.tw|otc_${code}.tw`)
        const found = (d.msgArray||[]).find(item => item.c===code && item.c)
        if (found) { addStock(code, found.n); directStatus.value = 'added' }
        else        directStatus.value = 'not_found'
      } catch { directStatus.value = 'error' }
    }

    // 切換搜尋時重設直接加入狀態
    watch(searchText, () => { directStatus.value = 'idle' })

    // ── 法人 ──────────────────────────────────────────────
    const instMap     = ref({})
    const instLoading = ref(false)

    function parseInstitutional(foreign, trust, dealer, otcForeign, otcTrust, otcDealer) {
      const m = {}
      function add(arr, key, codeField, diffField) {
        for (const item of (arr||[])) {
          const code = (item[codeField]||'').trim(); if (!code) continue
          if (!m[code]) m[code] = { foreign:0, trust:0, dealer:0 }
          const raw = (item[diffField]||'0').toString().replace(/,/g,'')
          m[code][key] += Math.round((parseInt(raw)||0) / 1000)
        }
      }
      add(foreign,    'foreign', 'SecurityCode',          'DifferenceShares')
      add(trust,      'trust',   'SecurityCode',          'DifferenceShares')
      add(dealer,     'dealer',  'SecurityCode',          'DifferenceShares')
      add(otcForeign, 'foreign', 'SecuritiesCompanyCode', 'DifferenceShares')
      add(otcTrust,   'trust',   'SecuritiesCompanyCode', 'DifferenceShares')
      add(otcDealer,  'dealer',  'SecuritiesCompanyCode', 'DifferenceShares')
      instMap.value = m
    }

    async function fetchInstitutional() {
      if (instLoading.value) return
      instLoading.value = true
      try {
        const [r1,r2,r3,r4,r5,r6] = await Promise.allSettled([
          fetchJsonList(INST_FOREIGN_URL),
          fetchJsonList(INST_TRUST_URL),
          fetchJsonList(INST_DEALER_URL),
          fetchJsonList(OTC_FOREIGN_URL),
          fetchJsonList(OTC_TRUST_URL),
          fetchJsonList(OTC_DEALER_URL),
        ])
        parseInstitutional(
          r1.status==='fulfilled'?r1.value:[],
          r2.status==='fulfilled'?r2.value:[],
          r3.status==='fulfilled'?r3.value:[],
          r4.status==='fulfilled'?r4.value:[],
          r5.status==='fulfilled'?r5.value:[],
          r6.status==='fulfilled'?r6.value:[],
        )
      } catch(e) { console.warn('[Inst]', e.message) }
      instLoading.value = false
    }

    const instRows = computed(() => watchlist.value.map(c => {
      const d = instMap.value[c], s = stockMap.value[c]
      const f = d?.foreign??0, t = d?.trust??0, dl = d?.dealer??0
      return { code:c, name:(s?.name||c), foreign:f, trust:t, dealer:dl, total:f+t+dl }
    }))

    // ── 信用 ──────────────────────────────────────────────
    const marginMap     = ref({})
    const marginLoading = ref(false)

    function parseMargin(tse, otc) {
      const m = {}
      for (const item of (tse||[])) {
        const code = (item.SecurityCode||'').trim(); if (!code) continue
        const ri = s => parseInt((item[s]||'0').toString().replace(/,/g,''))||0
        const bal = ri('MarginBalance'), prev = ri('MarginBalanceOfPreviousDay')
        const sbal= ri('ShortBalance'),  sprev= ri('ShortBalanceOfPreviousDay')
        m[code] = { marginBal:bal, marginChg:bal-prev, shortBal:sbal, shortChg:sbal-sprev }
      }
      for (const item of (otc||[])) {
        const code = (item.SecuritiesCompanyCode||item.SecurityCode||'').trim(); if (!code) continue
        const ri = s => parseInt((item[s]||'0').toString().replace(/,/g,''))||0
        const bal = ri('MarginBalance')||ri('MarginPurchaseBalance')
        const prev= ri('MarginBalanceOfPreviousDay')||ri('PreviousMarginBalance')
        const sbal= ri('ShortBalance')||ri('ShortSaleBalance')
        const sprev=ri('ShortBalanceOfPreviousDay')||ri('PreviousShortBalance')
        m[code] = { marginBal:bal, marginChg:bal-prev, shortBal:sbal, shortChg:sbal-sprev }
      }
      marginMap.value = m
    }

    async function fetchMargin() {
      if (marginLoading.value) return
      marginLoading.value = true
      try {
        const [r1,r2] = await Promise.allSettled([
          fetchJsonList(MARGIN_URL),
          fetchJsonList(OTC_MARGIN_URL),
        ])
        parseMargin(
          r1.status==='fulfilled'?r1.value:[],
          r2.status==='fulfilled'?r2.value:[],
        )
      } catch(e) { console.warn('[Margin]', e.message) }
      marginLoading.value = false
    }

    const marginRows = computed(() => watchlist.value.map(c => {
      const d = marginMap.value[c], s = stockMap.value[c]
      return { code:c, name:(s?.name||c), ...(d||{ marginBal:null, marginChg:null, shortBal:null, shortChg:null }) }
    }))

    watch(tab, v => {
      if (v==='法人' && !Object.keys(instMap.value).length) fetchInstitutional()
      if (v==='信用' && !Object.keys(marginMap.value).length) fetchMargin()
    })

    // ── 格式化 ────────────────────────────────────────────
    const cc   = n => n==null?'neu': n>0?'up': n<0?'dn':'flat'
    const fp   = n => (n==null||isNaN(n))?'--': Number(n).toFixed(2)
    const fc   = n => (n==null||isNaN(n))?'--': (n>0?'+':'')+n.toFixed(2)
    const fpct = n => (n==null||isNaN(n))?'--': (n>0?'+':'')+n.toFixed(2)+'%'
    const fvol = n => !n?'--': n>=10000?(n/10000).toFixed(1)+'萬': n.toLocaleString()
    const fchg = n => n==null?'--': (n>0?'+':'')+n.toLocaleString()
    const flot = n => n==null||n===0?'--': n.toLocaleString()

    return {
      todayDate, tableDate, tableTime,
      // groups
      nameMap, groupsData, curGroup, watchlist, showGroupPanel,
      editIdx, editName, renameInputEl,
      switchGroup, startRename, confirmRename, addStock, inWatchlist,
      // sync
      syncUrl, showSync, syncInput, syncState, syncMsg, syncShareLink, copied,
      openSync, saveSyncUrl, copyShareLink, forceUpload, forceDownload,
      // edit mode
      editMode, dragIdx, removeStock, startDrag,
      // views
      view, tab, tabs, openAdd,
      // detail
      detailCode, detailStock, openDetail,
      // list
      misLoading, tseIdx, indexBar, rows, status, stockMap,
      // search
      stockList, listLoading, listCounts, searchText, searchRef,
      searchResults, showDirectAdd, directStatus, directAdd, reloadStockList,
      // institutional
      instMap, instLoading, instRows,
      // margin
      marginMap, marginLoading, marginRows,
      // format
      cc, fp, fc, fpct, fvol, fchg, flot,
    }
  }
}).mount('#app')

function pick(obj, ...keys) {
  if (!obj) return Object.fromEntries(keys.map(k=>[k,null]))
  return Object.fromEntries(keys.map(k=>[k,obj[k]??null]))
}
</script>
</body>
